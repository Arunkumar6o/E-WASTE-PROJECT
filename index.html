<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body >
    <header class="logo">LLOGO</header>

       <section class="card-wrap">
        <div class="card">
          <h1 class="card-title">login</h1>

          <form class="login-form" onsubmit="return false;">
            <label class="field">
              <span class="field-label">username/email :</span>
              <input class="input" type="text" placeholder="" />
            </label>

            <label class="field">
              <span class="field-label">password&nbsp;&nbsp;&nbsp;&nbsp;:</span>
              <input class="input" type="password" placeholder="" />
            </label>

            <div class="verify-wrap">
              <button class="verify">Verify <span class="square"></span></button>
            </div>

            <div class="bottom-row">
              <div class="small-text">Didn’t have an account?</div>
              <div class="buttons">
                <button class="pill small" type="button">sign-up</button>
                <button class="pill small right" type="button">log-in</button>
              </div>
            </div>

          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
